name: Release merged pull request

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read release metadata
        id: metadata
        shell: pwsh
        run: ./eng/publishing/Read-ReleaseMetadata.ps1 -Mode Release

      - name: Install Inno Setup
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }

      - name: Build installer
        if: steps.metadata.outputs.should_publish == 'true'
        id: installer
        shell: pwsh
        run: ./eng/publishing/Build-Installer.ps1 -Version '${{ steps.metadata.outputs.version }}'

      - name: Sign and verify installer
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./eng/publishing/Sign-Installer.ps1 -InstallerPath '${{ steps.installer.outputs.installer_path }}'

      - name: Download current update feed
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/feed -Force | Out-Null
          gh release view update-feed 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release download update-feed --pattern update-manifest.json --dir artifacts/feed --clobber
            if ($LASTEXITCODE -ne 0) { throw "Existing update feed could not be downloaded." }
          }

      - name: Generate hash and manifest
        if: steps.metadata.outputs.should_publish == 'true'
        id: feed
        shell: pwsh
        run: |
          ./eng/publishing/New-UpdateManifest.ps1 `
            -Channel '${{ steps.metadata.outputs.channel }}' `
            -Version '${{ steps.metadata.outputs.version }}' `
            -InstallerPath '${{ steps.installer.outputs.installer_path }}' `
            -NotesPath '${{ steps.metadata.outputs.notes_path }}' `
            -ExistingManifestPath 'artifacts/feed/update-manifest.json'

      - name: Publish immutable version release
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.metadata.outputs.tag }}'
          $assets = @(
            '${{ steps.installer.outputs.installer_path }}',
            '${{ steps.feed.outputs.hash_path }}'
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --notes-file '${{ steps.metadata.outputs.notes_path }}'
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--title', '${{ steps.metadata.outputs.app_name }} ${{ steps.metadata.outputs.version }}',
              '--notes-file', '${{ steps.metadata.outputs.notes_path }}',
              '--target', '${{ github.event.pull_request.merge_commit_sha }}'
            )
            $arguments += $assets
            if ('${{ steps.metadata.outputs.channel }}' -eq 'preview') { $arguments += '--prerelease' }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw "Version release publication failed." }

      - name: Publish update feed last
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view update-feed 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-feed `
              --title 'Application update feed' `
              --notes 'Machine-readable update metadata. Do not delete this release.' `
              --prerelease `
              --target '${{ github.event.pull_request.merge_commit_sha }}'
            if ($LASTEXITCODE -ne 0) { throw "Update feed release creation failed." }
          }
          gh release upload update-feed '${{ steps.feed.outputs.manifest_path }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw "Update feed publication failed." }
