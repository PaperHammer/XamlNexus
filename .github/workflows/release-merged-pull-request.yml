name: Release merged pull request

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-release
  queue: max
  cancel-in-progress: false

jobs:
  check-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      pr_event: ${{ steps.check.outputs.pr_event }}
    steps:
      - name: Check commit messages for skip marker
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // NuGet OIDC rejects pull_request_target. Resolve the merged PR from the main push.
            core.setOutput('skip', 'true');
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: context.sha, per_page: 100
            });
            const matches = pulls.filter(pr => pr.merged_at && pr.base.ref === 'main'
              && pr.base.repo.full_name.toLowerCase() === `${context.repo.owner}/${context.repo.repo}`.toLowerCase()
              && pr.merge_commit_sha === context.sha);
            if (matches.length === 0) {
              core.info('No merged main PR for this commit; skipping release.');
              return;
            }
            if (matches.length !== 1) throw new Error('Ambiguous merged PR for this commit.');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: matches[0].number });
            if (!pr.merged || pr.merge_commit_sha !== context.sha || pr.base.ref !== 'main') {
              throw new Error('Merged PR does not match the pushed revision.');
            }
            // The push's previous main revision is the version baseline, not the updated PR base.
            pr.base.sha = context.payload.before;
            core.setOutput('pr_event', JSON.stringify({ pull_request: pr }));
            const refs = [...new Set([pr.head.sha, pr.merge_commit_sha])];
            let skip = false;
            for (const ref of refs) {
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref });
              if (/\[skip ci\]/i.test(data.commit.message)) {
                skip = true;
                break;
              }
            }
            core.setOutput('skip', String(skip));
            core.info(skip ? 'Skipping release: commit contains [skip ci].' : 'Release policy checks enabled.');

  release:
    needs: check-skip
    if: needs.check-skip.outputs.skip == 'false'
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read release metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_PR_EVENT: ${{ needs.check-skip.outputs.pr_event }}
        run: |
          $eventPath = Join-Path $env:RUNNER_TEMP 'release-pr-event.json'
          [IO.File]::WriteAllText($eventPath, $env:RELEASE_PR_EVENT)
          ./eng/release/Read-ReleaseMetadata.ps1 -Mode Release -EventPath $eventPath

      - name: Restore
        if: steps.metadata.outputs.should_publish == 'true'
        run: dotnet restore ${{ steps.metadata.outputs.solution }}

      - name: Build
        if: steps.metadata.outputs.should_publish == 'true'
        run: dotnet build ${{ steps.metadata.outputs.solution }} -c Release --no-restore -p:UseSharedCompilation=false -p:NuGetAudit=false

      - name: Test
        if: steps.metadata.outputs.should_publish == 'true'
        run: dotnet test ${{ steps.metadata.outputs.solution }} -c Release --no-build --no-restore -p:NuGetAudit=false

      - name: Pack .NET tool
        if: steps.metadata.outputs.should_publish == 'true'
        run: dotnet pack ${{ steps.metadata.outputs.project }} -c Release --no-build --no-restore -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Validate release package
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          RELEASE_PACKAGE_ID: ${{ steps.metadata.outputs.package_id }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: ./eng/release/Test-ReleasePackage.ps1 -Directory artifacts -PackageId $env:RELEASE_PACKAGE_ID -Version $env:RELEASE_VERSION

      - name: Log in to NuGet with OIDC
        if: steps.metadata.outputs.should_publish == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NuGet OIDC login did not return a temporary API key."
          }
          $packages = @(Get-ChildItem -LiteralPath artifacts -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike '*.snupkg' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, found $($packages.Count)."
          }
          $package = $packages[0]
          dotnet nuget push $package.FullName `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      - name: Create GitHub release
        if: steps.metadata.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts -Filter '*.nupkg')
          if ($packages.Count -eq 0) { throw "No release packages were produced." }
          $tag = '${{ steps.metadata.outputs.tag }}'
          $title = 'XamlNexus ${{ steps.metadata.outputs.version }}'
          & gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @($packages.FullName) --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed." }
            & gh release edit $tag --title $title --notes-file '${{ steps.metadata.outputs.notes_path }}'
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release update failed." }
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--title', $title,
              '--notes-file', '${{ steps.metadata.outputs.notes_path }}',
              '--target', '${{ github.sha }}'
            )
            $arguments += @($packages.FullName)
            if ('${{ steps.metadata.outputs.channel }}' -eq 'preview') {
              $arguments += '--prerelease'
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
          }
