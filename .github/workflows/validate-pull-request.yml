name: Validate pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

# Metadata edits must not cancel a build for the same PR.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) && 'build' || 'metadata' }}
  cancel-in-progress: true

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      full_build: ${{ steps.check.outputs.full_build }}
    steps:
      - name: Check commit message for skip marker
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: context.payload.pull_request.head.sha
            });
            const skip = /\[skip ci\]/i.test(data.commit.message);
            core.setOutput('skip', String(skip));
            core.setOutput('full_build', String(['opened', 'synchronize', 'reopened'].includes(context.payload.action)));
            core.info(skip ? 'Skipping PR checks: commit contains [skip ci].' : 'PR checks enabled.');

  validate:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        if: needs.check-skip.outputs.full_build == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release metadata
        shell: pwsh
        run: ./eng/release/Read-ReleaseMetadata.ps1 -Mode Validate

      - name: Restore
        if: needs.check-skip.outputs.full_build == 'true'
        run: dotnet restore src/XamlNexus.sln

      - name: Build
        if: needs.check-skip.outputs.full_build == 'true'
        run: dotnet build src/XamlNexus.sln -c Release --no-restore -p:UseSharedCompilation=false -p:NuGetAudit=false

      - name: Test
        if: needs.check-skip.outputs.full_build == 'true'
        run: dotnet test src/XamlNexus.sln -c Release --no-build --no-restore -p:NuGetAudit=false

  generated-projects:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true' && needs.check-skip.outputs.full_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [winui, hybrid]
        profile: [basic, standard]
        format: [sln, slnx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build generated application before and after composition
        shell: pwsh
        run: ./eng/Test-GeneratedProjects.ps1 -Preset ${{ matrix.preset }} -Profile ${{ matrix.profile }} -SolutionFormat ${{ matrix.format }}
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.preset }}-${{ matrix.profile }}-${{ matrix.format }}
          include-hidden-files: true
          path: |
            .artifacts/generated-build-*/*.log
            .artifacts/generated-build-*/*.binlog
            .artifacts/generated-build-*/results.json
