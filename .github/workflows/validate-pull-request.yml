name: Validate pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Keep only the newest validation run for each PR.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit message for skip marker
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: context.payload.pull_request.head.sha
            });
            const skip = /\[skip ci\]/i.test(data.commit.message);
            core.setOutput('skip', String(skip));
            core.info(skip ? 'Skipping PR checks: commit contains [skip ci].' : 'PR checks enabled.');

  validate:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release metadata
        shell: pwsh
        run: ./eng/release/Read-ReleaseMetadata.ps1 -Mode Validate

      - name: Restore
        run: dotnet restore src/XamlNexus.sln

      - name: Build
        run: dotnet build src/XamlNexus.sln -c Release --no-restore -p:UseSharedCompilation=false -p:NuGetAudit=false

      - name: Test
        run: dotnet test src/XamlNexus.sln -c Release --no-build --no-restore -p:NuGetAudit=false

  generated-projects:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [winui, hybrid]
        profile: [basic, standard]
        format: [sln, slnx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build generated application before and after composition
        shell: pwsh
        run: ./eng/Test-GeneratedProjects.ps1 -Preset ${{ matrix.preset }} -Profile ${{ matrix.profile }} -SolutionFormat ${{ matrix.format }}
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.preset }}-${{ matrix.profile }}-${{ matrix.format }}
          include-hidden-files: true
          path: |
            .artifacts/generated-build-*/*.log
            .artifacts/generated-build-*/*.binlog
            .artifacts/generated-build-*/results.json

  package-acceptance:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install packed tool, generate projects and run startup smoke tests
        shell: pwsh
        run: ./eng/Test-ToolPackage.ps1 -RunGuiSmoke
      - name: Upload package acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-acceptance
          include-hidden-files: true
          path: .artifacts/package-acceptance-*/**

  headless-lifecycle:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify single-instance identity and activation without UI
        shell: pwsh
        run: ./eng/Test-AppInstance.ps1 -Repetitions 2
      - name: Verify hybrid close cancellation and delayed save without UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/hybrid-close | Out-Null
          dotnet run --project eng/diagnostics/HybridCloseProbe/HybridCloseProbe.csproj -c Release -p:NuGetAudit=false *> .artifacts/hybrid-close/acceptance.log
          if ($LASTEXITCODE -ne 0) { throw 'Hybrid close acceptance failed.' }
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-lifecycle
          include-hidden-files: true
          path: |
            .artifacts/app-instance-*/**
            .artifacts/hybrid-close/**
