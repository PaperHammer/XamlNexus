name: Gallery portable build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/XamlNexus.Gallery/**'
      - 'src/XamlNexus.Common/Assets/ListPage/**'
      - 'eng/Publish-Gallery.ps1'
      - '.github/workflows/gallery.yml'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build portable Gallery
        shell: pwsh
        run: ./eng/Publish-Gallery.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: XamlNexus-Gallery-win-x64
          path: .artifacts/gallery/**/*.zip
          if-no-files-found: error
